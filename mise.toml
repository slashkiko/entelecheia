min_version = "2026.7.17"

[settings]
minimum_release_age = "7d"
lockfile = true
locked = true
locked_verify_provenance = true
gpg_verify = true

[tools]
"aqua:suzuki-shunsuke/pinact" = "4.1.1"
"aqua:zizmorcore/zizmor" = "1.29.0"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:betterleaks/betterleaks" = "1.7.3"
node = "24.18.1"
pnpm = "10.20.0"

[tasks.check]
description = "Run all supply-chain and workflow checks"
run = """
pinact run -fix=false -verify-comment -min-age 7
actionlint
zizmor .
shellcheck mise-tasks/*
betterleaks git .
"""

[tasks.build]
description = "Build the ent CLI into dist/"
run = "pnpm exec tsc -p tsconfig.build.json"

[tasks.typecheck]
description = "Type-check the TypeScript sources"
run = "pnpm exec tsc --noEmit"

[tasks.lint]
description = "Lint and format-check with Biome"
run = "pnpm exec biome check ."

[tasks.test]
description = "Run the Acceptance Criteria (Vitest)"
run = "pnpm exec vitest run"

[tasks.ent]
description = "Build to dist/ first, then run the ent CLI"
# **dist/ を先に作るのが本体で、CLI を呼ぶのはその後になる。**
# `bin` が指すのは dist/cli.js で、tsc を通すまで HEAD の実装は1行も反映されない。
# ent が ent 自身を直す Goal では、実装が commit 済みでも古い controller が
# 回り続ける形になり、「実装したのに動かない」の原因が実装ではなくビルドにある。
# 外からは区別が付かないので、回す口の側で毎回作り直す。
#
# 引数は `--` の後ろに置く（`mise run ent -- run <slug>`）。
depends = ["build"]
run = "node dist/cli.js"

[tasks.verify]
description = "Everything a Goal's Acceptance Criteria may depend on"
# build を入れるのは、typecheck が通ることと dist/cli.js が出来ることが別だから。
# tsconfig.json は noEmit で tests/** を含み、bin の実体を作るのは
# tsconfig.build.json（rootDir: src）の側になる。
depends = ["typecheck", "lint", "build", "test"]
