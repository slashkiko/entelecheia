version: 1

goal:
  id: assess-and-decide
  name: 観測した Fact から次の行動を決められる
  desired_state: |
    reconcile の1ティックが OBSERVE → VERIFY → ASSESS → DECIDE を回し、
    次に取るべき行動を Decision として返す。ACT の実行と永続化は本 Goal に含めない。

    ASSESS — src/assess/index.ts
      Goal の Acceptance Criteria と、観測・検証で得た Fact 集合を突き合わせ、
      埋まっていない差分を Gap として返す。

      Gap は2種類に分ける。
        unmet   — 検証できて、不合格だった（criteria.<id>.passed が false）
        unknown — まだ検証できていない（Fact が無い、または unresolved に残っている）

      satisfied（全 criteria を満たした）は VERIFIED な Fact だけで判定する。
      INFERRED な Fact は Plan の材料には使ってよいが、完了判定には使わない。
      unknown が1件でも残っていれば satisfied にはならない。

    DECIDE — src/decide/index.ts
      Gap と予算から次の行動を1つ選ぶ。行動は
      COMPLETE / ACT / VERIFY / WAIT / ESCALATE / REPLAN の6種類。

      LLM に委ねる範囲と、純ロジックで決める範囲を分ける。
      次の3つは LLM を呼ばずに決める（decidedBy: "guard"）。

        予算・回数・時間の上限に到達した          → ESCALATE(budget_exhausted)
        Gap が無く、結論の出ていない対象も無い    → COMPLETE
        Gap は無いが、結論の出ていない対象がある  → WAIT

      COMPLETE を LLM に決めさせない理由は、design.md §3.1 の
      「完了判定は VERIFIED のみで行う」を推論で迂回させないため。
      予算超過も同じで、暴走の停止条件を LLM の判断に依存させない。

      これ以外（Gap がある）は LlmPort に渡す。戻り値は必ず Zod で検証し、
      通らなければ受け取らない。2回リトライして通らなければ ESCALATE する。

    reconcile — src/reconcile/index.ts
      上を1ティックにまとめる。どのティックも有限時間で必ず return する。
      sleep して常駐しない。待ちは WAIT という Decision として返し、
      次のティックを待つ。

      同じ入力からは同じ Decision が出る（LLM を呼ばない経路について）。
      これが満たされないと、ループが収束したかを判定できない。

repository:
  provider: github
  owner: slashkiko
  name: entelecheia
  default_branch: main

setup:
  - pnpm install --frozen-lockfile

acceptance_criteria:
  - id: ac-1
    description: assess / decide / reconcile の全テストが通る（着手時点では落ちているのが正しい）
    verification: { type: command, run: mise run test }

  - id: ac-2
    description: 型チェックが通る（Action の discriminated union が崩れていない）
    verification: { type: command, run: mise run typecheck }

  - id: ac-3
    description: lint と format が通る
    verification: { type: command, run: mise run lint }

  - id: ac-4
    description: サプライチェーンと workflow のチェックが通る（baseline 由来）
    verification: { type: command, run: mise run check }

  - id: ac-5
    description: 変更を載せた PR の CI が成功している
    verification: { type: fact, key: github.ci.conclusion, equals: success }

  - id: ac-6
    description: LLM に委ねる範囲と純ロジックで決める範囲の境界が妥当か、人間が確認する
    verification:
      type: human
      prompt: |
        src/decide/index.ts の guard を読み、LLM を呼ばずに決めている3つの分岐
        （ESCALATE(budget_exhausted) / COMPLETE / WAIT）が妥当か確認してください。

        観点は2つあります。
        1. guard で決めるべきものが LLM に流れていないか。
           特に COMPLETE と予算超過は、推論で迂回されると
           design.md §3.1 と §7 が空文になります。
        2. 逆に guard が広すぎて、LLM に判断させるべき状況まで
           機械的に決めてしまっていないか。

context:
  background: |
    Phase 1 で OBSERVE と VERIFY が動くようになり、Fact と
    「結論が出なかった対象」（unobserved / unverified）が揃った。
    Phase 2 はそれを読んで次の行動を決める側を作る。

    design.md §8 の Phase 2 は ASSESS / DECIDE / ACT と永続化と CLI を含むが、
    1つの Goal には大きすぎるので3つに割る。本 Goal はその1本目で、
    Port を注入される純ロジックの範囲に閉じる。残りは別 Goal にする。
      - ACT（Claude Code の headless 実行、worktree 隔離）
      - 永続化（SQLite、write-ahead、lease、状態機械）

    Phase 2 で検証されるのは「reconcile ループが収束するか」。
    収束を判定するには、まず同じ入力から同じ Decision が出る必要がある。
    本 Goal はそこまでを担う。

  constraints:
    - 実装コードから外部ネットワークにアクセスしない。LLM も GitHub もコマンド実行も Port 経由で注入する
    - この制約は実装コードにかかる。setup と verification のコマンドには及ばない（ac-4 の pinact は GitHub API を叩く）
    - tests/ 配下は仕様なので変更しない。通らないなら実装側を直す
    - Fact の VERIFIED / INFERRED の分離と、VERIFIED への evidence 必須は変えない
    - 完了判定に INFERRED な Fact を使わない。COMPLETE は LLM に決めさせない
    - reconcile は sleep しない。待ちは Decision として返す
    - src/domain/goal.ts と src/domain/fact-keys.ts は確定済み。変更が必要なら実装前に合意を取る
    - docs/design.md の「3. 中核の設計判断」を勝手に変えない
    - 依存パッケージを増やさない。zod と yaml で足りる

  references:
    - title: 設計ドキュメント
      path: docs/design.md
    - title: Phase 1 で完了した Goal
      path: .goals/automate-observe-and-verify.yaml

policies:
  require_human_approval:
    - merge
    - force_push
    - push_to_default_branch
    - deploy
    - secret_access
    - external_send

budget:
  max_actor_runs: 15
  max_reconciles: 30
  max_wall_clock: 4h
  max_consecutive_failures: 3
