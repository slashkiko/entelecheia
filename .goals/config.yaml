version: 1

# Fill this in for the target repository. Every Goal under .goals/ inherits
# it, so you do not write it again in each Goal YAML; a Goal may still
# override any key by writing that key itself. ent start passes even when
# this is wrong, but the first tick surfaces it as a GitHub 404.
repository:
  provider: github
  owner: slashkiko
  name: entelecheia
  default_branch: main

  # Workflow names to leave out of github.ci.failed_job_count. Write the
  # name: in .github/workflows/*.yml, the one the PR checks tab shows.
  # ci:
  #   exclude_workflows: []

  # How the controller opens a PR.
  # pull_request:
  #   draft: false

# Commands that make the verification commands runnable. VERIFY runs these
# once before it evaluates any criterion, so they must be idempotent.
setup:
  # worktree は毎回まっさらに切られる。mise trust が無いと mise.toml が
  # 未信頼で弾かれ、criteria が「コードの問題ではなく実行できない」で落ちる。
  - mise trust --yes
  - mise exec -- pnpm install --frozen-lockfile

policies:
  # Operations the Agent is denied. These are added to whatever each Goal
  # declares, never subtracted, so this list is a repository-wide floor.
  require_human_approval:
    - merge
    - force_push
    - push_to_default_branch
    - deploy
    - secret_access
    - external_send

  # Paths the Agent must not rewrite, as globs. Added to each Goal's own
  # list the same way. PROTECTED_PATH_FLOOR still applies underneath.
  #
  # ここに書くのは、ent 自身のコードのうち、書き換えられると関門そのものが働かなく
  # なるものになる。ent が別のリポジトリを回すときには要らないので、コードの下限
  # （PROTECTED_PATH_FLOOR）ではなく、このリポジトリの config に置く。この config は
  # 下限の .goals/** が守る。
  #
  # 検証系（mise.toml / biome.json など）や依存の宣言（ルートの package.json）は
  # 入れない。あちらは「Agent が自分の criteria を通せる」問題で重要度は高いが、
  # Goal によっては正当に触る。ここは最小に保つ。
  #
  # パスのリテラルなので、ファイルを別の package へ移すときは、ここも同じ PR で動かす。
  # packages/ent/tests/protected-floor.test.ts が、規則の置き場をソースから確かめる。
  protected_paths:
    # 制御ループ本体。
    - packages/ent/src/controller/**
    # 関門のマッチャ本体。実パスの解決は ent に、glob の照合は core にある。
    - packages/ent/src/domain/protected-paths.ts
    - packages/core/src/domain/path-glob.ts
    # 関門と予算の停止条件が読む判断規則。関門が差分を取る相手（guardBaseOf）、
    # 未 commit の関門が見る述語、経過時間と連続失敗の数え方がここにある。
    - packages/core/src/domain/guard-rules.ts
    # 関門の適用範囲を決めるスキーマ。下限の定数もここにある。
    - packages/core/src/domain/goal.ts
    # この config を Goal の下へ敷く規則。protected_paths を足すのはここで、
    # 1行変えるだけで、この一覧が全部消える。
    - packages/core/src/domain/goal-config.ts
    # Agent の許可・拒否ツールを決める場所。
    - packages/ent/src/adapters/claude.ts
    - packages/ent/src/adapters/codex.ts
    # Provider 間で共有する役割と出力の指示。
    - packages/ent/src/adapters/agent-prompt.ts
    # シェルを起動する唯一の場所。setup と verification.run が通る。
    - packages/ent/src/adapters/local.ts
    # 資格情報の除去リスト。
    - packages/core/src/domain/withheld-env.ts
    # 合成ルート。関門の入力を作る Adapter の注入と、未 commit の関門が突き合わせる
    # 観測先（verifyRoot）がここに集まる。規則を触らずに、関門へ流れる観測を差し替えられる。
    - packages/ent/src/wiring/index.ts
    # core の入口。ent は core を package 名で import するので、どのファイルが
    # @entelecheia/core/domain/guard-rules.js になるかは、ここの exports が決める。
    # 規則のファイルを触らずに、向け先だけを別のファイルへ替えられる。
    - packages/core/package.json
    # 移す前のパス。移行の間だけ残す。worktree は作り直さずに使い続けるので、移す前に
    # 切った worktree では、関門が見る差分が古いパスで出る。移す前に作った worktree が
    # 残っていないことを確かめてから外す。
    #
    # 移す前の形は2つある。packages/ へ移す前の src/... と、ent を packages/ent へ
    # 移してから一部を core へ切り出すまでの packages/ent/src/domain/... になる。
    - src/controller/**
    - src/domain/protected-paths.ts
    - src/domain/guard-rules.ts
    - src/domain/goal.ts
    - src/domain/goal-config.ts
    - src/adapters/claude.ts
    - src/adapters/codex.ts
    - src/adapters/agent-prompt.ts
    - src/adapters/local.ts
    - src/domain/withheld-env.ts
    - src/wiring/index.ts
    - packages/ent/src/domain/guard-rules.ts
    - packages/ent/src/domain/goal.ts
    - packages/ent/src/domain/goal-config.ts
    - packages/ent/src/domain/withheld-env.ts

  # Which publish steps the controller performs. manual means a human does
  # it instead; the controller stops and says so. Written out rather than
  # left implicit so that ent init and ent plan hand you the same shape.
  publish:
    push_branch: auto
    # Set this to manual for a repository shared with a team. Opening a pull
    # request notifies reviewers, and undoing it does not recall the notice.
    open_pull_request: auto

  # Where progress goes: pr, stdout, or a file path. ent run --report wins
  # over this for the tick it is passed on.
  # progress:
  #   report: pr
