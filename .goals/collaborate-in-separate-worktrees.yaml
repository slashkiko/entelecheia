version: 1

goal:
  id: collaborate-in-separate-worktrees
  name: 役割の違う Agent が別々の worktree で協働し、レビュー役がレビューを行える
  desired_state: |
    1つの Goal の中で、役割の違う Actor がそれぞれ自分の worktree を持って動く。
    そのうえで、レビュー役が実際にレビューを行える。

    **当初は2本の Goal に割っていたが、1本に戻した。** 分けた理由は「レビュー役に
    自分の作業ツリーが無いと、読んでいる最中に実装側が書き換わる」だったが、
    それは実装の順序の話であって、Goal を分ける理由としては弱かった。分けたまま
    進めると、あちらの仕様6本が作業ツリーに居るあいだ CI が赤いままになり、
    こちらは ac-5（CI 成功）に永久に届かない。1ティック目でそうなった。

    いまは `worktreeNameFor` が goal.id だけから名前を決めるので、1つの Goal が
    持てる作業ツリーは1つしかない。役割を足しても両者が同じ作業ツリーを共有し、
    レビュー役が checkout や clean を行えば実装側の途中の差分が消える。逆に
    実装側が書き換えれば、レビュー役は「いつの時点のコードを読んだのか」を
    言えなくなる。design.md §4.2 は `ActorRole` を宣言しているが、`src/` には
    role という語が1つも無い。

    どう作るかは Actor が決める。以下は「何が満たされていればよいか」を書く。

    1. worktree の名前が (goal.id, role) から決まる

      role が違えば別の作業ツリー・別のブランチになる。同じ (goal.id, role) を
      何度呼んでも同じ名前になる（ティックをまたいで差分を積み上げるため、
      試行ごとに変えない）。

      **`implement` の名前だけは goal.id のまま据え置く。** 既存の worktree と
      PR のブランチは `entelecheia/<goal.id>` にあり、規則を変えると走行中の
      Goal が別ブランチに乗り換えて、それまでの差分が PR から消える。

    2. 第2引数を必須にする

      既定値を持たせない。`verifyRoot`（src/cli.ts）と未 commit の関門
      （src/controller/index.ts）は、観測した `local.branch` を
      `worktreeBranchFor(worktreeNameFor(...))` と突き合わせて「その dirty が
      どこを観測した値か」を判定している（design.md §10-11）。候補のブランチが
      2本になった時点で、この判定は「どちらと突き合わせるか」を明示しない限り
      成り立たない。既定値があると、review の作業ツリーの汚れを実装の書き残しと
      読んでも、型でもテストでも気づけない。

      呼び出し側は `src/act/index.ts`・`src/controller/index.ts`（3箇所）と、
      `src/cli.ts` の `verifyRoot` にある。`verifyRoot` はいま
      `join(stateDir, "worktrees", goal.goal.id)` と規則を直書きしていて
      `worktreeNameFor` を通っていない。ここも同じ関数を通す。規則の正を
      1箇所にする理由は `worktreeNameFor` の doc コメントに書いてある。

    3. 検証と観測の対象は implement の作業ツリーのまま変えない

      `mise run test` を流す先も `local.*` の観測先も implement 側にする。
      レビュー役の作業ツリーで criteria を検証すると、レビュー中に書き換わった
      ものを実装の検証結果として読むことになる。ここは Phase 3 の5本目で
      repoRoot から worktree に移した線で、役割を足しても動かさない。

    4. role が Run に残る

      誰がどの作業ツリーで何をしたかを、あとから `ent get` で読めるようにする。
      write-ahead の starting 側に入れる。あとから足すと、途中で kill された
      Run の role が空のまま残る（design.md §3.6）。

    5. role を書かない ACT は implement として扱う

      既に走っている Goal の Decision には role が無い。読み直したときに
      別の作業ツリーへ移らないようにする。ACT の action に role を持たせるなら
      任意項目にする。

    6. 1ティックで起動する Actor は1体のまま

      **並列実行はここでは求めない。** 協働はティックをまたいだ交代で成立させる。
      同じティックで2体を同時に走らせると、Run の確定・lease・「1ティックに
      Decision 1行」の設計まで巻き込むことになる（design.md §5 の
      「複数 Actor の並列実行」は据え置き）。lease の取得と延長、write-ahead、
      orphan の回収、状態遷移の順序は変えない。

    ここまでが配管で、以下がレビュー役そのものになる。

    7. レビュー役は読めるが書けない

      読み取りのツール（Read / Glob / Grep）は持ち、編集のツール
      （Edit / Write / NotebookEdit）は持たない。許可リストから外すだけでなく
      拒否リストにも入れる。拒否ルールは許可ルールより先に評価され、どの
      permissionMode でも効くので、二重にしておく。Bash はテストを流すのに要る
      ので残す。

      **指示ではなく権限で分ける。** intent は LLM が生成するもので、「書いた」
      ことは確かめられても「従った」ことは確かめられない（design.md §3.2）。
      「レビューして」と頼むだけでは、Agent が従わなければ実装を書き換えられる。

      `policies.require_human_approval` から来る拒否は role によらずそのまま
      効かせる。レビュー役だからといって merge や force push を許さない。

    8. 実装役の権限を弱めない

      役割を足すついでに実装役の許可・拒否が緩めば、隔離そのものが後退する。
      実装役は編集のツールを持ったままで、`ALWAYS_DENIED`（`git worktree` や
      `git branch -D` など、検査の入力を Agent に選ばせないための拒否）も
      残ったままにする。

    9. レビュー役は実装役と別のプロンプトで起動する

      同じ intent でも、読む側と書く側では求めるものが違う。権限だけ分けて
      プロンプトが同じだと、レビュー役は編集を試みて拒否され続ける。

    10. レビューの結論が Fact として残る

      観測キーに `review.verdict` と `review.reviewed_sha` を足す。前者が
      レビューの結論で、後者がどの commit を読んだか。「通った」だけでは
      いつの時点のコードのレビューか分からず、実装が進んだあとの Fact を
      そのまま完了判定に使うことになる。

      これで controller 側に足すものは無い。Goal YAML が
      `verification: { type: fact, key: review.verdict, equals: approved }`
      と書けば、既存の機構がそのまま働く。VERIFIED な Fact だけが完了判定に
      使われ（design.md §3.1）、approved でない限り Gap が残る。
      **guard に「レビューを通れ」という条件を足さない。** 完了判定の境界
      （design.md §7）を動かさずに済む形を選ぶ。

      捏造しない。レビューを回していないティックで approved を作らない。
      確かめられなければ Fact を作らず、理由を付けて unobserved に残す。
      どの Port がこの Fact を作るかは決めてよいが、選んだら
      `src/domain/fact-keys.ts` のレジストリで、どの Port のどのメソッドが
      返すキーなのかが読めるようにする。

    11. レビュー役をいつ起動するかは、この Goal の範囲外

      揃えるのは「起動できる」「結論が Fact になる」の2つまでにする。
      DECIDE がレビューを選ぶ条件や、実装 → レビュー → 修正の往復をどう回すかは、
      この2つが動いてから別に決める。先に往復まで決めると、レビューが1度も
      回っていない状態で停止条件を設計することになる。

    仕様は2ファイルある。どちらも仕様が正で、この YAML の記述と食い違ったら
    テストに合わせる。

      tests/worktree-roles.test.ts   12本（1〜6 に対応）
      tests/review-actor.test.ts     12本（7〜10 に対応）

    着手時点では 519 件中 13 件が落ちていた。1ティック目で worktree-roles の
    7本が緑になり、残るのは review-actor の6本になる。

repository:
  provider: github
  owner: slashkiko
  name: entelecheia
  default_branch: main

setup:
  - pnpm install --frozen-lockfile

acceptance_criteria:
  - id: ac-1
    description: >-
      worktree-roles と review-actor の24本が通り、既存のテストも通ったままになる。
      着手時点では 519 件中 13 件が落ちていた。1ティック目で worktree-roles の
      7本が緑になったので、残るのは review-actor の6本
    # 全件で見る。ac-5 の CI も同じものを流すので、ここを絞ると
    # 「ac-1 は緑だが CI は赤」という状態が作れてしまう。
    verification: { type: command, run: mise run test }

  - id: ac-2
    description: 型チェックが通る（1ティック目で通るようになった。壊さずに保つ）
    verification: { type: command, run: mise run typecheck }

  - id: ac-3
    description: lint と format が通る
    verification: { type: command, run: mise run lint }

  - id: ac-4
    description: サプライチェーンと workflow のチェックが通る（baseline 由来）
    verification: { type: command, run: mise run check }

  - id: ac-5
    description: 変更を載せた PR の CI が成功している
    verification: { type: fact, key: github.ci.conclusion, equals: success }

  - id: ac-6
    description: 隔離と観測の出自が後退していないか、人間が確認する
    verification:
      type: human
      prompt: |
        この Goal が満たしたいのは「テストが通ること」ではなく、
        「役割を足しても、隔離と観測の出自の判定が壊れないこと」です。
        次を確認してください。

        1. `worktreeNameFor` の呼び出し側が全部たどられているか。とくに
           `src/cli.ts` の `verifyRoot` が、規則を直書きしたままになっていないか。
           あそこが `worktreeNameFor` を通らないと、規則が2箇所に分かれます
        2. 検証コマンドと `local.*` の観測先が implement の作業ツリーのままか。
           review 側に移っていないか
        3. 未 commit の関門（design.md §10-11）が、どちらのブランチと
           突き合わせるかを明示しているか。implement の作業ツリーの
           書き残しを見落とす形になっていないか
        4. 1ティックで起動する Actor が1体のままか。lease の取得と延長、
           write-ahead、orphan の回収、Decision の書き込み、状態遷移の順序が
           変わっていないか。Decision は1ティックに1行のままか
        5. 保護パスの検査そのもの（src/domain/protected-paths.ts と
           controller の guardedDecision）が弱められていないか

        レビュー役については、`src/adapters/claude.ts` を保護パスから外して
        あります。Agent の許可・拒否を決めるファイルなので、差分を読んで
        次も確認してください。

        6. 実装役の許可・拒否が変わっていないか。`ALWAYS_DENIED`（`git worktree`
           や `git branch -D` など）が残っているか。`disallowedToolsFor` が
           `policies.require_human_approval` を role によらず落とし続けているか
        7. レビュー役の編集ツールが、許可リストから外れているだけでなく
           拒否リストにも入っているか。許可リストから外すだけだと、設定の
           読み込み順や既定値が変わったときに素通りしえます
        8. controller の資格情報を Agent に渡さない仕組み（WITHHELD_ENV と
           settingSources: []）が残っているか
        9. `review.verdict` を作る経路が、レビューを回していないティックで
           approved を作らないか。確かめられなかったときに Fact を作らず
           unobserved に残しているか（design.md §3.1）
        10. `src/domain/fact-keys.ts` に足したキーが、どの Port のどのメソッドが
            返すものか、レジストリのコメントから読めるか

        テストは Port を差し替えているので、実際の Claude Code がツール制限に
        従うかまでは確かめていません。本 Goal は「レビュー役をいつ起動するか」
        を範囲外にしており、role: review の ACT を出す経路がまだないので、
        実際に走らせて確かめるのは起動の条件を決める次の Goal に回します。

context:
  background: |
    「複数のエージェントが別 worktree で協働できる」と「レビュー役がレビューを
    行える」を、当初は2本の Goal に割っていた。1ティック目のあと1本に戻している。

    分けた理由は「レビュー役に自分の作業ツリーが無いと、読んでいる最中に実装側が
    書き換わり、レビューの対象が定まらない」だった。これは実装の順序として正しい
    （配管が先、レビュー役が後）が、Goal を分ける理由にはならない。同じ Actor が
    同じ作業ツリーで順に進めればよく、順序は仕様テストが押さえる。

    分けたまま進めると詰まる。2本の仕様を同じ commit で入れたので、あちらの6本は
    最初から作業ツリーに居る。CI は `mise run verify` を全件流すため、あちらが
    実装されるまで PR の CI は赤いままで、こちらは ac-5（CI 成功）に永久に届かない。
    ac-1 は `--exclude` で逃がせたが、CI は逃がせなかった。1ティック目でそうなった。

    協働の形は「同時」ではなく「交代」にしてある。controller は1ティックで
    1つの Decision を書き、1体の Actor を起動する設計で（design.md §3.6）、
    同じティックに2体を走らせると write-ahead と lease の前提が変わる。
    ティックをまたいで役割が入れ替われば、実装 → レビュー → 修正の往復は
    成立する。並列化はそれが回ってから別に判断する。

    `src/controller/**` と `src/adapters/claude.ts` を protected_paths から
    外してある。外したのは適用対象であって検査の仕組みではない（constraints を
    参照）。前者は、未 commit の関門と保護パスの検査がどちらも `worktreeNameFor` を
    呼んでいるので、第2引数を必須にすると手が入るため。後者は、role ごとに
    使ってよいツールを分けるには、あのファイルを書き換えるしかないため。

    後者のほうが危ない。Agent の許可・拒否を決めている当のファイルなので、
    ac-6 の 6〜8 で実装役の権限が弱まっていないかを人間に見てもらう。

  constraints:
    - tests/worktree-roles.test.ts と tests/review-actor.test.ts は仕様なので、
      assert とシナリオを変えない。通らないなら実装側を直す。新しい口を足して
      既存のフィクスチャが型として足りなくなった場合に限り、フィクスチャへの
      追記はしてよい
    - 既存の tests/ を弱めない。とくに tests/controller*.test.ts と
      tests/act.test.ts と tests/claude-adapter.test.ts は通ったままにする
    - 実装役の許可・拒否を弱めない。ALWAYS_DENIED を削らない。
      disallowedToolsFor が require_human_approval を落とす経路を role で分岐させない
    - "controller の資格情報を Agent に渡さない仕組み（WITHHELD_ENV、
      settingSources: []）を外さない"
    - src/decide/** は変更しない。レビューをいつ起動するかと完了判定の境界は
      本 Goal の範囲外（desired_state の 11）
    - src/domain/fact-keys.ts に足すのは review.verdict と review.reviewed_sha の
      2つだけにする。既存のキーを消さない、名前を変えない
    - 確かめられなかったことを Fact の不在に畳まない。理由を付けて unobserved に残す
    - 検証コマンドとローカル観測の実行先（src/cli.ts の verifyRoot）を
      implement の作業ツリーから動かさない。repoRoot にも review 側にも移さない
    - 保護パスの検査そのものを弱めない。src/domain/protected-paths.ts と
      controller の guardedDecision は、本 Goal で外したのは適用対象であって
      仕組みではない
    - src/controller/** に足すのは role の受け渡しだけにする。lease の取得と延長、
      write-ahead、orphan の回収、状態遷移の順序を変えない。
      Decision は1ティックに1行のままにする
    - 1ティックで起動する Actor は1体のままにする。並列実行を入れない
    - 完了判定と停止条件を LLM に委ねない（design.md §7）
    - git を新しく叩くならシェルを通さない。argv 配列で渡す（design.md §7）
    - .goals/** は触らない（policies.protected_paths）
    - テストから実際の GitHub と Claude API を叩かない。git worktree も作らない
    - docs/design.md の「3. 中核の設計判断」を勝手に変えない
    - 依存パッケージを増やさない
    - mise run check（サプライチェーン検査）を壊さない
    - docs/design.md と README.md を、足したものに合わせて直す。design.md §4.2 の
      ActorRole、§4.3 の観測キーの表、§5 の MVP のスコープと「複数 Actor の
      並列実行」の扱い、§10-11 の未 commit の関門が読むブランチが対象になる
    - PR の作成とコメントの投稿はしない。controller が行う

  references:
    - title: 仕様（role ごとの worktree）
      path: tests/worktree-roles.test.ts
    - title: 仕様（レビュー役の権限と、結論の Fact 化）
      path: tests/review-actor.test.ts
    - title: worktree の名前とブランチの規則
      path: src/act/index.ts
    - title: Agent の許可・拒否ツールを決めている場所
      path: src/adapters/claude.ts
    - title: 観測キーのレジストリ
      path: src/domain/fact-keys.ts
    - title: 保護パスの検査と未 commit の関門
      path: src/controller/index.ts
    - title: 検証と観測の実行先を決めている verifyRoot
      path: src/cli.ts
    - title: 設計ドキュメント
      path: docs/design.md

policies:
  require_human_approval:
    - merge
    - force_push
    - push_to_default_branch
    - deploy
    - secret_access
    - external_send
  protected_paths:
    # src/controller/** と src/adapters/claude.ts を外してある。前者は
    # worktreeNameFor の呼び出し側だから、後者は role ごとにツールを分ける先だから。
    # 外したのは適用対象であって、検査の仕組みではない（constraints を参照）。
    - .goals/**
    # 関門そのもの。
    - src/domain/protected-paths.ts
    # レビューをいつ起動するかと、完了判定の境界。本 Goal の範囲外。
    - src/decide/**
    # 検証系。ここを書き換えられると Agent が自分の criteria を通せる。
    - mise.toml
    - mise-tasks/**
    - vitest.config.ts
    - biome.json
    - tsconfig*.json
    - .github/**
    # 依存の追加は人間が通す。
    - package.json
    - pnpm-lock.yaml

budget:
  # 2本ぶんを1本に統合したので広げた。3h は ACTIVE にした時刻からの経過で数える
  # ので、ac-6（人間の確認）を待つ時間が入らなかった。1ティック目の時点で
  # 残り1時間を切っていた。
  max_actor_runs: 14
  max_reconciles: 30
  max_wall_clock: 24h
  max_consecutive_failures: 3
  max_unchanged_reconciles: 4
