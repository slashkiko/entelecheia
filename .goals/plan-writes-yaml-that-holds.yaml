version: 1

goal:
  id: plan-writes-yaml-that-holds
  name: ent plan が書いた YAML が、手で直さなくても使える
  desired_state: |
    `ent plan` が生成した宣言には、そのままでは使えない箇所が2つある。どちらも
    手書きの既存 Goal には無く、生成物にだけある。**プロンプトで頼む形にはしない。
    決定的なバリデーションで落とす。**

    1. `setup` を提案しなかったら、キーごと書かない

      いまは `setup: proposed.setup` を無条件で書き出す（`src/usecase/plan.ts`）。
      `proposed.setup` は `.default([])` なので、planner が何も言わなければ
      `setup: []` が YAML に残る。`mergeGoalConfig` は**キーの有無**で config を
      敷くかを決めるため（`src/domain/goal-config.ts` の
      `raw.setup === undefined ? config.setup : raw.setup`）、この `[]` は
      `.goals/config.yaml` の setup を打ち消す。

      実際に起きた。`calculate-metered-cost-from-raw-logs` は worktree で
      `mise trust` も依存インストールも走らず、criteria が「コードの問題ではなく
      実行できない」で落ち続けた。

      **空なら書かない。** そうすれば repo スコープの宣言が下に敷ける。
      `[]` を「空にしたつもり」として尊重する既存の意味は変えない。変えるのは
      「planner が何も言わなかった」を `[]` と書き出している側だけ。

    2. `type: human` の criterion が1つも無い提案は、書かずに落とす

      生成された criteria が `type: command` だけだったため、
      `calculate-metered-cost-from-raw-logs` は誰のレビューも経ずに COMPLETED に
      なった（PR #7）。手書きの既存 Goal は全て `type: human` を持っている。

      プロンプトは既に human の書式を提示している
      （`{ "type": "human", "prompt": "<what the approver must confirm>" }`）のに、
      planner はそれを出さなかった。**design.md 10-11 と同じで、頼んで得られるのは
      確認できない遵守でしかない。**

      1本でも `type: human` があれば通す。無ければ、その提案一式を書かない。
      `ent plan` は既に「validation に落ちた一式は1つも書かない」挙動なので、
      そこへ乗せる。落ちたときの出力で、**何が足りないのかと、どう直すのかが
      分かること。**「validation error」だけを出して終わりにしない。

    ## スコープ外

    「現状で既に全部通る criteria しか無い提案を落とす」は**この Goal では
    やらない。** あれは提案された `type: command` を宣言時点で実行する必要があり、
    `src/wiring/index.ts` へ新しい Port を注入することになる。あそこは
    `PROTECTED_PATH_FLOOR` にあり、Actor が触ると関門が止める。実際に1度止まった。
    別 Goal に分けてある。

    ## 触る場所

    `src/usecase/plan.ts` が主。`PROTECTED_PATH_FLOOR` の外にある。
    シェルを起動する必要は無い。新しい Port も要らない。

# setup は書かない。.goals/config.yaml の setup（mise trust + pnpm install）を
# 敷かせる。ここに `setup: []` と書くと、この Goal が塞ごうとしている不具合を
# 宣言自身がやることになる。

acceptance_criteria:
  - id: ac-1
    description: 既存の検証一式が通る。2つの変更で既存の宣言や CLI の他の経路を壊していない
    verification:
      type: command
      run: mise run verify

  - id: ac-2
    description: >-
      2つの性質を名指しで検証するテストがあり、通る。(1) planner が setup を
      提案しなければ、書き出した YAML に setup キーが無い。明示的に [] を
      書いた場合はその意味が残る。(2) type: human を含まない提案は1本も
      書かれず、出力に何を足せばよいかが出る。このファイルは今は無いので、
      この criterion は今日は赤い。
    verification:
      type: command
      run: mise exec -- pnpm exec vitest run tests/plan-declaration-quality.test.ts

  # ac-3 として `review.verdict == approved` を置いていたが、2026-08-26 に外した。
  # **`review.verdict` を作るコードが `src/` に無い。** レビュー役は権限も
  # プロンプトも worktree も配線済みだが、起動する経路がどこにも無く、
  # `action.role` は常に undefined で ACT は必ず実装役に落ちる。詳細は未着手の
  # 宣言 `.goals/start-the-review-we-wired.yaml` にある。置いたままだと Fact が
  # 永久に現れず、VERIFY を選び続けて `loop_detected` で止まる。
  # 人間の関門は ac-3（旧 ac-4）が引き続き担う。

  - id: ac-3
    description: 関門が本当に機械で効いているかを人間が確認する
    verification:
      type: human
      prompt: |
        この Goal は「頼んでも守られないので機械で落とす」ためのものです。
        プロンプトの文言を足しただけで終わっていないかを見てください。

        1. `type: human` の必須化は、**プロンプトの追記ではなく検証コード**に
           なっているか。planner の出力を信じる形になっていないか
        2. `setup` を書かなくなったことで、`[]` を明示的に書いた既存の意味
           （空にしたつもりを尊重する）が壊れていないか。`mergeGoalConfig` の
           「キーの有無で見る」規則と噛み合っているか
        3. 落ちたときの出力を実際に読んで、何を直せばよいか分かるか
        4. `src/wiring/index.ts` を触っていないか。スコープ外の3点目に
           手を出していないか

context:
  background: |
    2026-08-25 に `ent plan` で `calculate-metered-cost-from-raw-logs` を生成し、
    1周回して PR #7 まで到達させた。そのとき見つかった生成物の欠陥のうち、
    シェル実行も新しい Port も要らない2つを閉じる。

    この Goal は `harden-what-plan-writes` と `plan-writes-declarations-that-hold`
    を ABANDONED にして絞り込んだもの。前者はベースが古く PR #7 と同じ修正を
    重複していた。後者は3点目が `src/wiring/index.ts` への注入を要し、保護パスの
    関門で `ESCALATE(protected_path_touched)` に落ちた。
  constraints:
    - src/wiring/index.ts を変更しない。PROTECTED_PATH_FLOOR にあり、触れば関門が止める
    - src/domain/goal.ts と src/domain/goal-config.ts も同じく変更できない。スキーマ変更を要する案を選ばない
    - シェルを起動しない。この2点はどちらも提案オブジェクトを見るだけで判定できる
    - setup キーの省略は「planner が提案しなかった場合」に限る。明示的な [] の意味は変えない
    - 既存の宣言を書き換えない。.goals/config.yaml も書き換えない
  references:
    - title: "config を Goal の下へ敷く規則（キーの有無で判断している箇所）"
      path: src/domain/goal-config.ts
    - title: "設計: 頼んでも確認できる遵守は得られない（10-11）"
      path: docs/design.md

budget:
  max_actor_runs: 8
  max_reconciles: 20
  max_wall_clock: 3h
  max_consecutive_failures: 3
  max_unchanged_reconciles: 4
