version: 1

goal:
  id: keep-the-declared-contract
  name: 宣言した契約を実装が守る
  desired_state: |
    MVP 完了後のレビューで、宣言と実装が食い違っている箇所が4つ見つかった。
    どれも「文書やスキーマが約束していることを、コードがしていない」種類で、
    テストが1本も無いまま出荷されている。仕様は tests/ に書いてあるので、
    そちらに合わせる。

    context.constraints が Actor に届く — src/act/index.ts

      src/domain/goal.ts の constraints には「ACT にそのまま渡る自由記述」と
      書いてあるが、goal.context を読むコードが src/ のどこにも無い。
      ActorInvocation が運ぶのは runId / intent / worktree / deniedOperations /
      signal の5つだけになっている。

      これが効くのは tests/** の扱い。guard-the-controller.yaml は
      「criteria を確かめる仕組みと確かめる中身は別」という理由で tests/** を
      protected_paths から意図的に外し、代わりに各 Goal の constraints に
      「このテストは仕様なので変更しない」と書いてきた。その行が届いていない
      ので、criteria が mise run test の Actor は仕様テストを書き換えて通せる。
      そうして出来た criteria.ac-1.passed は VERIFIED になる。

      渡し方は決めない。intent に畳んでも ActorInvocation に足してもよい。
      固定するのは「文言が届くこと」と「intent を落とさないこと」だけ。

    --dry-run が DB に書かない — src/cli.ts

      SKILL.md は「Actor の起動と PR への書き込みは起きない。snapshot /
      verifications / decision / status も書かない」と書いている。
      だが upsertGoal と setObserveTarget と state ディレクトリの作成が
      tick() より前、dry-run の分岐の外にある。

      prNumber は GoalState の一部で ent get が出す。覗いたつもりの
      ent run <slug> --dry-run --pr 42 が観測先を恒久的に差し替え、
      次の本番ティックが違う PR を見る。

    ent start していない Goal が run で動き出さない — src/cli.ts

      design.md は「Goal YAML のレビューがそのまま承認ゲートを担うので、
      ent start は DRAFT から ACTIVE に直行する」と書いている。
      controller 側にも「Goal が登録されていない」で止まる分岐がある。
      だが cli.ts が tick() の前に upsert するので、その分岐は本番で到達しない。
      start を挟まない run が Actor を起動し、予算を使い、1ティックで
      DRAFT から COMPLETED まで進みうる。宣言されている唯一の承認ゲートを
      飛ばせるなら、ゲートは無いのと同じ。

    slug が .goals/ の外を指せない — src/cli.ts

      slug はそのまま join(repoRoot, ".goals", `${slug}.yaml`) に入る。
      id の一致はローダーが見るが、それはファイル名だけでディレクトリを縛らない。
      実測で ent start ../outside/escape-goal が終了コード 0 を返し、
      ツリー外の Goal の登録に成功する。読めた Goal の setup と
      verification.run はそのままシェルで走る。

    テストは tests/act-constraints.test.ts と tests/cli-contract.test.ts に
    書いてある。着手時点では両方落ちる。仕様はそちらが正で、この YAML の記述と
    食い違ったらテストに合わせる。

repository:
  provider: github
  owner: slashkiko
  name: entelecheia
  default_branch: main

setup:
  - pnpm install --frozen-lockfile

acceptance_criteria:
  - id: ac-1
    description: act-constraints と cli-contract のテストが通る（着手時点では落ちている）
    verification: { type: command, run: mise run test }

  - id: ac-2
    description: 型チェックが通る
    verification: { type: command, run: mise run typecheck }

  - id: ac-3
    description: lint と format が通る
    verification: { type: command, run: mise run lint }

  - id: ac-4
    description: サプライチェーンと workflow のチェックが通る（baseline 由来）
    verification: { type: command, run: mise run check }

  - id: ac-5
    description: 変更を載せた PR の CI が成功している
    verification: { type: fact, key: github.ci.conclusion, equals: success }

  - id: ac-6
    description: 関門を緩めずに収束したか、人間が確認する
    verification:
      type: human
      prompt: |
        この Goal は「宣言と実装の食い違い」を閉じるものです。直った4件そのもの
        より、直し方が関門を迂回していないかを見てください。

        1. protected_paths を1つも外さずに収束したか。過去2本の Goal
           （agent-friendly-cli と commit-what-the-actor-wrote）は
           src/controller/** を外した状態で回っています。同じことを
           していないか、PR の差分で確かめてください
        2. tests/act-constraints.test.ts と tests/cli-contract.test.ts の
           assert とシナリオが変わっていないか。この2本が仕様です
        3. context.constraints の渡し方が、intent を捨てていないか

        あわせて、この Goal を回した時点では constraints はまだ Actor に
        届いていません。1周目の Actor には制約が伝わらないので、
        「既存のテストを弱めない」は人間が見る側で担保してください。
        これが直ることで、次の Goal からは宣言部に書けば届くようになります。

context:
  background: |
    MVP 完了後のレビューで挙がった指摘のうち、機械が判定できて、かつ修正先が
    保護パスの外にあるものだけを1本にまとめた。

    保護パスの中に修正先があるもの（VERIFY が controller の環境変数ごと
    Actor の書いたコードを実行する件、--dry-run が未 commit の関門を通らない件、
    .git/hooks 経由の実行）は、この Goal には入れていない。関門を強くする変更を
    Actor 自身に書かせると、その関門は飾りになる。人間が別に入れる。

    決定論的な検査のうち、設定ファイル側に置けるもの（biome / tsconfig /
    mise / CI / renovate / CODEOWNERS）は先に人間が入れてある。
    それらは protected_paths の中にあり、Actor に書き換えさせられない。

  constraints:
    - テストから実際の GitHub と Claude API を叩かない
    - tests/act-constraints.test.ts と tests/cli-contract.test.ts は仕様なので、
      assert とシナリオを変えない。通らないなら実装側を直す
    - 既存の tests/ も弱めない。新しい振る舞いには新しいテストを足す
    - policies.protected_paths を外さない。外さないと直せないものは、
      この Goal の対象外なので手を付けずに残す
    - 既存のサブコマンドの成功時の挙動を変えない。変えるのは
      「そもそも受け付けない」「書かない」の側だけ
    - 依存パッケージを増やさない
    - mise run check（サプライチェーン検査）を壊さない
    - docs/design.md の「3. 中核の設計判断」を勝手に変えない
    - PR の作成とコメントの投稿はしない。controller が行う

  references:
    - title: 設計ドキュメント
      path: docs/design.md
    - title: エージェント向けの手順（契約の宣言側）
      path: .claude/skills/ent/SKILL.md
    - title: CLI の現状
      path: src/cli.ts
    - title: ACT の現状
      path: src/act/index.ts
    - title: Goal スキーマ（constraints の宣言）
      path: src/domain/goal.ts

policies:
  require_human_approval:
    - merge
    - force_push
    - push_to_default_branch
    - deploy
    - secret_access
    - external_send
  protected_paths:
    # 制御ループ本体と、Goal の宣言部。
    - src/controller/**
    - .goals/**
    # 関門そのものと、Agent の許可・拒否ツールを決めるファイル。
    - src/domain/protected-paths.ts
    - src/adapters/claude.ts
    # 関門の適用範囲を決めるスキーマ。protected_paths の既定が空なので、
    # ここを書き換えれば関門そのものを外せる。過去の Goal には入っていない。
    - src/domain/goal.ts
    # シェルを実際に起動する唯一の場所。setup と verification.run は
    # controller の権限と環境変数で走るので、関門と同じ重さで扱う。
    # 過去の Goal には入っていない。
    - src/adapters/local.ts
    # 検証系。ここを書き換えられると Agent が自分の criteria を通せる。
    # tests/** は入れない（理由は guard-the-controller.yaml に書いた）。
    - mise.toml
    - mise-tasks/**
    - vitest.config.ts
    - biome.json
    - tsconfig*.json
    - .github/**
    # 依存の追加は人間が通す。constraints にも書いてある。
    - package.json
    - pnpm-lock.yaml

budget:
  max_actor_runs: 10
  max_reconciles: 20
  max_wall_clock: 3h
  max_consecutive_failures: 3
  max_unchanged_reconciles: 4
