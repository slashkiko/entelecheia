version: 1

goal:
  id: review-agent-reviews
  name: レビュー役の Agent が、実際にレビューを行える
  desired_state: |
    レビュー役の Actor が起動でき、その結論が Fact として残る。
    role ごとの worktree は前の Goal（.goals/collaborate-in-separate-worktrees.yaml）
    が用意する。ここで作るのは役割の中身になる。

    design.md §4.2 は `ActorRole` を宣言しているが、いま起動できる Actor は
    1種類しかなく、実装用のツール（Edit / Write / NotebookEdit）をそのまま
    持っている。この状態で「レビューして」という intent を渡しても、それは
    実装役に読み方だけ変えるよう頼んでいるのと同じで、Agent が従わなければ
    実装を書き換えられる。**指示ではなく権限で分ける。** intent は LLM が
    生成するもので、「書いた」ことは確かめられても「従った」ことは確かめられない
    （design.md §3.2）。

    どう作るかは Actor が決める。以下は「何が満たされていればよいか」を書く。

    1. レビュー役は読めるが書けない

      読み取りのツール（Read / Glob / Grep）は持ち、編集のツール
      （Edit / Write / NotebookEdit）は持たない。許可リストから外すだけでなく
      拒否リストにも入れる。拒否ルールは許可ルールより先に評価され、どの
      permissionMode でも効くので、二重にしておく（実装役の deniedOperations と
      同じ扱い）。Bash はテストを流すのに要るので残す。

      `policies.require_human_approval` から来る拒否は role によらずそのまま
      効かせる。レビュー役だからといって merge や force push を許さない。

    2. 実装役の権限を弱めない

      役割を足すついでに実装役の許可・拒否が緩めば、隔離そのものが後退する。
      実装役は編集のツールを持ったままで、`ALWAYS_DENIED`（`git worktree` や
      `git branch -D` など、検査の入力を Agent に選ばせないための拒否）も
      残ったままにする。

    3. レビュー役は実装役と別のプロンプトで起動する

      同じ intent でも、読む側と書く側では求めるものが違う。権限だけ分けて
      プロンプトが同じだと、レビュー役は編集を試みて拒否され続ける。

    4. レビューの結論が Fact として残る

      観測キーに `review.verdict` と `review.reviewed_sha` を足す。前者が
      レビューの結論で、後者がどの commit を読んだか。「通った」だけでは
      いつの時点のコードのレビューか分からず、実装が進んだあとの Fact を
      そのまま完了判定に使うことになる。

      これで controller 側に足すものは無い。Goal YAML が
      `verification: { type: fact, key: review.verdict, equals: approved }`
      と書けば、既存の機構がそのまま働く。VERIFIED な Fact だけが完了判定に
      使われ（design.md §3.1）、approved でない限り Gap が残るので COMPLETE には
      届かない。**guard に「レビューを通れ」という条件を足さない。** 完了判定の
      境界（design.md §7）を動かさずに済む形を選ぶ。

    5. 捏造しない

      レビューを回していないティックで approved を作らない。確かめられなければ
      Fact を作らず、理由を付けて unobserved に残す（design.md §3.1）。
      どの Port がこの Fact を作るかは決めてよい。レビュー役の Run の結果から
      作るのが素直だが、そこは実装が選ぶ。選んだら `src/domain/fact-keys.ts` の
      レジストリで、どの Port のどのメソッドが返すキーなのかが読めるようにする。

    6. レビュー役をいつ起動するかは、この Goal の範囲外

      ここで揃えるのは「起動できる」「結論が Fact になる」の2つまでにする。
      DECIDE がレビューを選ぶ条件や、実装 → レビュー → 修正の往復をどう回すかは、
      この2つが動いてから別に決める。先に往復まで決めると、レビューが
      1度も回っていない状態で停止条件を設計することになる。

    テストは tests/review-actor.test.ts に12本ある。着手時点ではそのうち6本が
    落ちている。仕様はそちらが正で、この YAML の記述と食い違ったらテストに合わせる。

    **`mise run test` の全体は、2本の仕様を入れた時点で 519 件中 13 件落ちている。**
    差の7本は前の Goal `collaborate-in-separate-worktrees` の仕様
    （tests/worktree-roles.test.ts）で、あちらが先に main へ入っていれば
    落ちているのは本 Goal の6本だけになる。担当分はファイル名で切り分ける。

repository:
  provider: github
  owner: slashkiko
  name: entelecheia
  default_branch: main

setup:
  - pnpm install --frozen-lockfile

acceptance_criteria:
  - id: ac-1
    description: >-
      review-actor の12本が通り、既存のテストも通ったままになる。
      着手時点で落ちているのは review-actor の6本（前の Goal
      collaborate-in-separate-worktrees が未マージなら、その7本も落ちている）
    verification: { type: command, run: mise run test }

  - id: ac-2
    description: 型チェックが通る（着手時点では落ちている。ActorInvocation に role の口がまだ無い）
    verification: { type: command, run: mise run typecheck }

  - id: ac-3
    description: lint と format が通る
    verification: { type: command, run: mise run lint }

  - id: ac-4
    description: サプライチェーンと workflow のチェックが通る（baseline 由来）
    verification: { type: command, run: mise run check }

  - id: ac-5
    description: 変更を載せた PR の CI が成功している
    verification: { type: fact, key: github.ci.conclusion, equals: success }

  - id: ac-6
    description: 実装役の権限が弱まっていないか、人間が確認する
    verification:
      type: human
      prompt: |
        この Goal は Agent の許可・拒否を決めるファイル（src/adapters/claude.ts）
        を書き換えます。ここは普段は保護パスに入れてあり、本 Goal に限って
        外してあります。差分を読んで、次を確認してください。

        1. 実装役の許可・拒否が変わっていないか。`ALWAYS_DENIED`（`git worktree`
           や `git branch -D` など）が残っているか。`disallowedToolsFor` が
           `policies.require_human_approval` を role によらず落とし続けているか
        2. レビュー役の編集ツールが、許可リストから外れているだけでなく
           拒否リストにも入っているか。許可リストから外すだけだと、設定の
           読み込み順や既定値が変わったときに素通りしえます
        3. controller の資格情報を Agent に渡さない仕組み（WITHHELD_ENV と
           settingSources: []）が残っているか
        4. `review.verdict` を作る経路が、レビューを回していないティックで
           approved を作らないか。確かめられなかったときに Fact を作らず
           unobserved に残しているか（design.md §3.1）
        5. `src/domain/fact-keys.ts` に足したキーが、どの Port のどのメソッドが
           返すものか、レジストリのコメントから読めるか

        テストは Port を差し替えているので、実際の Claude Code がツール制限に
        従うかまでは確かめていません。ただし本 Goal は「レビュー役をいつ起動するか」
        を範囲外にしており（desired_state の 6、src/decide/** も保護パス）、
        role: review の ACT を出す経路がまだありません。**実際に走らせて
        確かめるのは、起動の条件を決める次の Goal に回します。** ここで見るのは
        差分と、claudeActor が role で分岐している中身までにしてください。

context:
  background: |
    「複数のエージェントが別 worktree で協働できる」と「レビュー役がレビューを
    行える」を2本に割った、その2本目にあたる。1本目
    （.goals/collaborate-in-separate-worktrees.yaml）が worktree と Run を
    role 単位にし、本 Goal がレビュー役そのものを足す。1本目が先に main へ
    入っていることを前提にする。

    レビューの結論を Fact にしたのは、controller 側に手を入れずに済むため。
    「レビューを回した」と「レビューが通った」を controller が区別するには、
    どこかに VERIFIED な観測が要る。それを guard の条件として書くと完了判定の
    境界（design.md §7）に手が入るが、観測キーとして足せば Goal YAML の
    criteria から参照するだけで済み、既存の ASSESS がそのまま扱う。

    `src/domain/fact-keys.ts` は「変更が必要なら実装前に合意を取る」レジストリ
    なので、`review.verdict` と `review.reviewed_sha` の追加そのものが本 Goal の
    合意事項にあたる。同じく `src/adapters/claude.ts` は普段は保護パスだが、
    role ごとにツールを分けるにはあのファイルを書き換えるしかないので、本 Goal に
    限って外してある。外したのは適用対象であって、検査の仕組みではない。
    そのぶん ac-6 で実装役の権限が弱まっていないかを人間に見てもらう。

  constraints:
    - tests/review-actor.test.ts は仕様なので、assert とシナリオを変えない。
      通らないなら実装側を直す。新しい口を足して既存のフィクスチャが型として
      足りなくなった場合に限り、フィクスチャへの追記はしてよい
    - 既存の tests/ を弱めない。とくに tests/claude-adapter.test.ts と
      tests/protected-paths.test.ts は通ったままにする
    - 実装役の許可・拒否を弱めない。ALWAYS_DENIED を削らない。
      disallowedToolsFor が require_human_approval を落とす経路を role で分岐させない
    - "controller の資格情報を Agent に渡さない仕組み（WITHHELD_ENV、
      settingSources: []）を外さない"
    - src/controller/** と src/decide/** は変更しない。レビューを起動する条件と
      完了判定の境界は本 Goal の範囲外（desired_state の 6）
    - src/domain/fact-keys.ts に足すのは review.verdict と review.reviewed_sha の
      2つだけにする。既存のキーを消さない、名前を変えない
    - 確かめられなかったことを Fact の不在に畳まない。理由を付けて unobserved に残す
    - 完了判定と停止条件を LLM に委ねない（design.md §7）
    - .goals/** は触らない（policies.protected_paths）
    - テストから実際の GitHub と Claude API を叩かない
    - docs/design.md の「3. 中核の設計判断」を勝手に変えない
    - 依存パッケージを増やさない
    - mise run check（サプライチェーン検査）を壊さない
    - docs/design.md と README.md を、足したものに合わせて直す。§4.2 の ActorRole、
      §4.3 の観測キーの表、§5 の MVP のスコープが対象
    - PR の作成とコメントの投稿はしない。controller が行う

  references:
    - title: 仕様（レビュー役の権限と、結論の Fact 化）
      path: tests/review-actor.test.ts
    - title: Agent の許可・拒否ツールを決めている場所
      path: src/adapters/claude.ts
    - title: 観測キーのレジストリ
      path: src/domain/fact-keys.ts
    - title: role と worktree の受け渡し
      path: src/act/index.ts
    - title: 前提になる Goal（role ごとの worktree）
      path: .goals/collaborate-in-separate-worktrees.yaml
    - title: 設計ドキュメント
      path: docs/design.md

policies:
  require_human_approval:
    - merge
    - force_push
    - push_to_default_branch
    - deploy
    - secret_access
    - external_send
  protected_paths:
    # 本 Goal は role ごとにツールを分けるので、src/adapters/claude.ts を外して
    # ある。外したのは適用対象であって、検査の仕組みではない（constraints を参照）。
    # そのぶん ac-6 で実装役の権限が弱まっていないかを人間が見る。
    - .goals/**
    # 制御ループ本体と、レビューを起動する条件を決める側。本 Goal の範囲外。
    - src/controller/**
    - src/decide/**
    # 関門そのもの。
    - src/domain/protected-paths.ts
    # 検証系。ここを書き換えられると Agent が自分の criteria を通せる。
    - mise.toml
    - mise-tasks/**
    - vitest.config.ts
    - biome.json
    - tsconfig*.json
    - .github/**
    # 依存の追加は人間が通す。
    - package.json
    - pnpm-lock.yaml

budget:
  max_actor_runs: 10
  max_reconciles: 20
  max_wall_clock: 3h
  max_consecutive_failures: 3
  max_unchanged_reconciles: 4
