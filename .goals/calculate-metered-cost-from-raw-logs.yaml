# Written by ent plan. Review it before running ent start — typing that command
# is the approval point, and nothing runs until you do (design.md §3.2).
# Edit anything here freely; this file is an ordinary Goal declaration.
version: 1
goal:
  id: calculate-metered-cost-from-raw-logs
  name: Calculate metered cost from raw token logs
  desired_state: ent provides a supported interface for reading the per-category token breakdown retained in raw logs for Actor Runs and DECIDE LlmCalls. Given declared unit prices, ent calculates the corresponding metered-billing amount in code and exposes a result that automated verification can assert. Claude Max OAuth usage remains outside charged USD accounting while its token usage and hypothetical metered cost remain available.
  depends_on: []
repository:
  provider: github
  owner: slashkiko
  name: entelecheia
  default_branch: main
# worktree は毎回まっさらに切られるので、検証コマンドが動く状態をここで作る。
# mise trust が無いと mise.toml が未信頼で弾かれ、ac-1/ac-2 の両方が
# 「コードの問題ではなく実行できない」で落ちる。
setup:
  - mise trust --yes
  - mise exec -- pnpm install --frozen-lockfile
acceptance_criteria:
  - id: ac-1
    description: Automated verification demonstrates that raw-log token-category details are readable for both Runs and LlmCalls, declared per-category prices produce the exact expected amount, and OAuth usage is not counted as charged USD while its tokens remain recorded.
    verification:
      type: command
      run: mise run verify
  - id: ac-2
    description: >-
      `ent cost <slug>` reads the per-category token breakdown out of the raw logs and, given
      unit prices supplied by the caller through --prices, prints the metered amount as a numeric
      `metered_usd` on stdout. This is the interface design.md 10-10 says is missing. It does not
      exist today, so this criterion is red until it is built — ac-1 alone is already green on an
      unchanged checkout and therefore cannot signal completion by itself.
    verification:
      type: command
      run: "mise run ent -- cost calculate-metered-cost-from-raw-logs --prices examples/prices.example.json --json 2>/dev/null | jq -e '.metered_usd | type == \"number\"' > /dev/null"
context:
  background: The stored token totals combine input, cache creation, cache read, and output tokens even though those categories have different prices. Their breakdown remains in raw logs, so accurate metered-cost calculation requires a supported way to read that detail and multiply it by prices supplied through declarations.
  constraints:
    - Do not hard-code provider prices. Unit prices come from a caller-supplied price file, never from compiled-in constants.
    - Prices cannot live under .goals/ — that path is protected for this Goal, and extending the goal-config schema is blocked for the same reason. Put the example price file at examples/prices.example.json and read it through the --prices flag.
    - ac-1 (mise run verify) already passes on an unchanged checkout. Treat ac-2 as the criterion that actually proves the work; add tests so ac-1 covers the new code as well.
    - Do not change the rule that Claude Max OAuth executions are excluded from charged USD accounting.
    - Do not stop recording token usage for OAuth executions.
    - Preserve Run.tokens for Actor executions and LlmCall.tokens for DECIDE calls that create no Run.
  references:
    - title: "Design: cost controls, measured token usage, and open question 10-10"
      path: docs/design.md
policies:
  require_human_approval:
    - merge
    - force_push
    - push_to_default_branch
    - deploy
    - secret_access
    - external_send
  protected_paths:
    - src/controller/**
    - .goals/**
    - src/domain/protected-paths.ts
    - src/domain/guard-rules.ts
    - src/domain/goal.ts
    - src/domain/goal-config.ts
    - src/adapters/claude.ts
    - src/adapters/codex.ts
    - src/adapters/agent-prompt.ts
    - src/adapters/local.ts
    - src/domain/withheld-env.ts
    - src/wiring/index.ts
    - .git/**
    - .goals/.state/**
  publish:
    push_branch: auto
    open_pull_request: auto
budget:
  max_actor_runs: 8
  max_reconciles: 20
  max_wall_clock: 3h
  max_consecutive_failures: 3
  max_unchanged_reconciles: 4
